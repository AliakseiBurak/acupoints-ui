<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AcuPoints - Chart of Acupressure Points</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="header-inner">
            <form id="search-form" class="header-search" autocomplete="off">
                <input type="text" id="search-input" placeholder="Search acupoints...">
                <button type="submit" id="search-btn">Search</button>
            </form>
            <a href="#" id="lang-switch">Русский</a>
        </div>
    </header>

    <main>
        <!-- Meridian Menu -->
        <section id="meridian-menu">
            <button type="button" id="menu-toggle" class="menu-toggle" aria-expanded="true" aria-controls="meridian-grid">
                <span id="menu-title">Meridians</span>
                <span class="menu-chevron" aria-hidden="true"></span>
            </button>
            <div id="meridian-collapse" class="meridian-collapse">
                <ul id="meridian-grid" class="meridian-list">
                    <!-- Meridian items will be loaded here -->
                </ul>
            </div>
        </section>

        <!-- Results Section -->
        <section id="results">
            <div class="loading">Loading meridians...</div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 AcuPoints Local Version</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const langSwitch = document.getElementById('lang-switch');
            const searchForm = document.getElementById('search-form');
            const searchInput = document.getElementById('search-input');
            const searchBtn = document.getElementById('search-btn');
            const resultsDiv = document.getElementById('results');
            const meridianGrid = document.getElementById('meridian-grid');
            const menuTitle = document.getElementById('menu-title');
            const menuToggle = document.getElementById('menu-toggle');
            const meridianMenu = document.getElementById('meridian-menu');
            let currentLang = 'en';
            let meridiansData = null;
            let activeMeridian = null;

            const MERIDIAN_RU = {
                'Lung Meridian': 'Лёгких',
                'Large Intestine Meridian': 'Толстой кишки',
                'Stomach Meridian': 'Желудка',
                'Spleen Meridian': 'Селезёнки',
                'Heart Meridian': 'Сердца',
                'Small Intestine Meridian': 'Тонкой кишки',
                'Bladder Meridian': 'Мочевого пузыря',
                'Kidney Meridian': 'Почек',
                'Pericardium Meridian': 'Перикарда',
                'Triple Energizer Meridian': 'Тройного обогревателя',
                'Gallbladder Meridian': 'Желчного пузыря',
                'Liver Meridian': 'Печени',
                'Governing Vessel (Du Mai)': 'Правящей вены (Ду-май)',
                'Conception Vessel (Ren Mai)': 'Сцепной вены (Жэнь-май)'
            };

            const T = {
                meridian:       { en: 'Meridian:', ru: 'Мерридиан:' },
                category:       { en: 'Category:', ru: 'Категория:' },
                location:       { en: 'Location:', ru: 'Расположение:' },
                benefits:       { en: 'Benefits:', ru: 'Польза:' },
                classification: { en: 'Classification:', ru: 'Классификация:' },
                viewDetails:    { en: 'View Full Details', ru: 'Подробнее' },
                meridians:      { en: 'Meridians', ru: 'Мердианы' },
                searchBtn:      { en: 'Search', ru: 'Найти' },
                searchPh:       { en: 'Search acupoints...', ru: 'Поиск акупунктурных точек...' },
                allAcupoints:   { en: 'All Acupoints', ru: 'Все акупунктурные точки' },
                searchFor:      { en: 'Search results for', ru: 'Результаты поиска:' },
                noResults:      { en: 'No results found for', ru: 'Ничего не найдено по запросу' },
                noAcupoints:    { en: 'No acupoints found.', ru: 'Акупунктурные точки не найдены.' },
                noMeridians:    { en: 'No meridians found.', ru: 'Мердианы не найдены.' },
                noMeridianPts:  { en: 'No acupoints found for meridian', ru: 'У меридиана нет акупунктурных точек' },
                errMeridians:   { en: 'Error loading meridians. Please try again.', ru: 'Ошибка загрузки меридианов. Повторите попытку.' },
                errMeridian:    { en: 'Error loading meridian. Please try again.', ru: 'Ошибка загрузки меридиана. Повторите попытку.' },
                errSearch:      { en: 'Error searching. Please try again.', ru: 'Ошибка поиска. Повторите попытку.' },
                errAcupoints:   { en: 'Error loading acupoints. Please try again.', ru: 'Ошибка загрузки точек. Повторите попытку.' },
                na:             { en: 'N/A', ru: '—' }
            };

            const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));

            const t = key => T[key][currentLang];
            const trMeridian = name => (currentLang === 'en' ? name : (MERIDIAN_RU[name] || name));

            function pointsWord(n) {
                if (currentLang === 'en') return n === 1 ? 'acupoint' : 'acupoints';
                const n10 = n % 10, n100 = n % 100;
                if (n10 === 1 && n100 !== 11) return 'точка';
                if (n10 >= 2 && n10 <= 4 && (n100 < 12 || n100 > 14)) return 'точки';
                return 'точек';
            }

            function foundLabel(n) {
                return currentLang === 'en' ? `${n} found` : `найдено: ${n}`;
            }

            function applyStaticLabels() {
                menuTitle.textContent = t('meridians');
                searchBtn.textContent = t('searchBtn');
                searchInput.placeholder = t('searchPh');
            }

// Language toggle
            langSwitch.addEventListener('click', (e) => {
                e.preventDefault();
                currentLang = currentLang === 'en' ? 'ru' : 'en';
                langSwitch.textContent = currentLang === 'en' ? 'Русский' : 'English';
                applyStaticLabels();
                if (meridiansData) displayMeridians(meridiansData);
                loadRecent();
            });

            // Search functionality
            searchForm.addEventListener('submit', (e) => {
                e.preventDefault();
                performSearch();
            });

            // Collapse / expand the meridian menu
            menuToggle.addEventListener('click', () => {
                const collapsed = meridianMenu.classList.toggle('collapsed');
                menuToggle.setAttribute('aria-expanded', String(!collapsed));
            });

            applyStaticLabels();
            loadMeridians();
            loadRecent();

            async function loadMeridians() {
                try {
                    const response = await fetch('/api/meridians');
                    const data = await response.json();

                    if (data.success && data.data.length > 0) {
                        meridiansData = data.data;
                        displayMeridians(data.data);
                    } else {
                        meridianGrid.innerHTML = `<li class="menu-empty">${esc(t('noMeridians'))}</li>`;
                    }
                } catch (error) {
                    meridianGrid.innerHTML = `<li class="menu-empty">${esc(t('errMeridians'))}</li>`;
                    console.error('Error:', error);
                }
            }

            function displayMeridians(meridians) {
                meridianGrid.innerHTML = meridians.map(m => `
                    <li class="meridian-item${activeMeridian === m.name ? ' active' : ''}" data-meridian="${esc(m.name)}">
                        <span class="meridian-name">${esc(trMeridian(m.name))}</span>
                        <span class="meridian-count">${m.count} ${esc(pointsWord(m.count))}</span>
                    </li>
                `).join('');

                meridianGrid.querySelectorAll('.meridian-item').forEach(item => {
                    item.addEventListener('click', () => {
                        activeMeridian = item.getAttribute('data-meridian');
                        meridianGrid.querySelectorAll('.meridian-item').forEach(el => el.classList.remove('active'));
                        item.classList.add('active');
                        viewMeridian(activeMeridian);
                    });
                });
            }

            async function viewMeridian(meridianName) {
                try {
                    const response = await fetch(`/api/meridians/${encodeURIComponent(meridianName)}`);
                    const data = await response.json();

                    if (data.success && data.data.length > 0) {
                        displayAcupoints(data.data, `${t('meridian')} ${trMeridian(data.meridian)}`);
                        const newUrl = `${window.location.pathname}?meridian=${encodeURIComponent(meridianName)}`;
                        window.history.pushState({path: newUrl}, '', newUrl);
                    } else {
                        resultsDiv.innerHTML = `<div class="no-results">${esc(t('noMeridianPts'))} "${esc(data.meridian || meridianName)}".</div>`;
                    }
                } catch (error) {
                    resultsDiv.innerHTML = `<div class="error">${esc(t('errMeridian'))}</div>`;
                    console.error('Error:', error);
                }
            }

            async function loadRecent() {
                const urlParams = new URLSearchParams(window.location.search);
                const meridianParam = urlParams.get('meridian');

                if (meridianParam) {
                    const name = decodeURIComponent(meridianParam);
                    activeMeridian = name;
                    if (meridiansData) displayMeridians(meridiansData);
                    await viewMeridian(name);
                } else {
                    activeMeridian = null;
                    if (meridiansData) displayMeridians(meridiansData);
                    await loadAllAcupoints();
                }
            }

            async function loadAllAcupoints() {
                try {
                    const response = await fetch('/api/acupoints?limit=200');
                    const data = await response.json();

                    if (data.success && data.data.length > 0) {
                        displayAcupoints(data.data, `${t('allAcupoints')} (${data.total})`);
                    } else {
                        resultsDiv.innerHTML = `<div class="no-results">${esc(t('noAcupoints'))}</div>`;
                    }
                } catch (error) {
                    resultsDiv.innerHTML = `<div class="error">${esc(t('errAcupoints'))}</div>`;
                    console.error('Error:', error);
                }
            }

            async function performSearch() {
                const term = searchInput.value.trim();
                if (!term) {
                    await loadRecent();
                    return;
                }

                try {
                    const response = await fetch(`/api/acupoints/search/${encodeURIComponent(term)}`);
                    const data = await response.json();

                    if (data.success && data.data.length > 0) {
                        displayAcupoints(data.data, `${t('searchFor')} "${term}" (${foundLabel(data.count)})`);
                    } else {
                        resultsDiv.innerHTML = `<div class="no-results">${esc(t('noResults'))} "${esc(term)}".</div>`;
                    }
                } catch (error) {
                    resultsDiv.innerHTML = `<div class="error">${esc(t('errSearch'))}</div>`;
                    console.error('Error:', error);
                }
            }

            function displayAcupoints(acupoints, title) {
                const na = t('na');
                resultsDiv.innerHTML = `
                    <div class="acupoints-header">
                        <h2>${esc(title)}</h2>
                    </div>
                    <div class="acupoint-grid">
                        ${acupoints.map(point => `
                            <div class="acupoint-card">
                                <h3 class="acupoint-name">
                                    ${esc(currentLang === 'en' ? point.name : (point.name_ru || point.name))}
                                </h3>
                                <div class="acupoint-details">
                                    <div class="detail-item">
                                        <strong>${esc(t('meridian'))}</strong> ${esc(point.meridian ? trMeridian(point.meridian) : na)}
                                    </div>
                                    ${point.category ? `
                                    <div class="detail-item">
                                        <strong>${esc(t('category'))}</strong> ${esc(point.category)}
                                    </div>` : ''}
                                    <div class="detail-item">
                                        <strong>${esc(t('location'))}</strong>
                                        ${esc(currentLang === 'en' ? (point.location || na) : (point.location_ru || point.location || na))}
                                    </div>
                                    ${(() => {
                                        const b = currentLang === 'en' ? (point.benefits_en || point.benefits) : point.benefits;
                                        return b ? `<div class="detail-item"><strong>${esc(t('benefits'))}</strong> ${esc(b)}</div>` : '';
                                    })()}
                                    ${(() => {
                                        const c = currentLang === 'en' ? (point.classification_en || point.classification) : point.classification;
                                        return c ? `<div class="detail-item"><strong>${esc(t('classification'))}</strong> ${esc(c)}</div>` : '';
                                    })()}
                                </div>
                                <div class="acupoint-footer">
                                    <a href="/api/acupoints/${encodeURIComponent(point.id)}" class="view-link" target="_blank" rel="noopener">
                                        ${esc(t('viewDetails'))}
                                    </a>
                                    ${point.image ? `
                                        <div class="acupoint-image">
                                            <img src="/images/acupoints/${encodeURIComponent(point.image)}" alt="${esc(point.name)}" loading="lazy" onerror="this.style.display='none'">
                                        </div>
                                    ` : ''}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
