services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: acupoints-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - ./content:/app/content
      - ./public:/app/public
    restart: unless-stopped
    networks:
      - acupoints-network

  nginx:
    image: nginx:alpine
    container_name: acupoints-nginx
    ports:
      - "80:80"
      - "4443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./public:/usr/share/nginx/html
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - acupoints-network

networks:
  acupoints-network:
    driver: bridge
